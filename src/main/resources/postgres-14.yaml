services:
  postgresql:
    image: postgres:14.19
    container_name: my-postgres-db
    environment:
      POSTGRES_DB: kontroll
      POSTGRES_USER: <fint.database.username>
      POSTGRES_PASSWORD: <fint.database.password>
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: